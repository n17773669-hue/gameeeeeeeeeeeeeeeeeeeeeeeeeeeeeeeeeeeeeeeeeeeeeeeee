<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Intro Door Transition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0c10; font-family: sans-serif; overflow: hidden; height: 100vh; }

        /* LỚP 1: KHUNG GAME CHÍNH (Nằm dưới cùng) */
        #game-main {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #1f2833; color: #66fcf1;
            opacity: 0; transition: opacity 1s ease;
        }

        /* LỚP 2: LỚP ÁNH SÁNG TRẮNG */
        #flash-light {
            position: absolute; width: 100%; height: 100%;
            background: #ffffff; opacity: 0;
            pointer-events: none; z-index: 50;
            transition: opacity 0.6s ease-out;
        }

        /* LỚP 3: CÁNH CỬA VÀ NÚT BÁNH RĂNG */
        .door-container {
            position: absolute; width: 100%; height: 100%;
            z-index: 100; display: flex;
        }
        
        .door-left, .door-right {
            width: 50%; height: 100%;
            background: #0b0c10;
            border: 2px solid #45a29e;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* Nút Bánh Răng ở giữa */
        .gear-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90px; height: 90px;
            background: #1f2833; border: 4px solid #66fcf1;
            border-radius: 50%; color: #66fcf1;
            font-size: 40px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px #66fcf1;
            z-index: 101;
            transition: transform 0.8s ease, opacity 0.5s ease;
        }

        /* KHUNG ANIMATION XOAY VÀ MỞ CỬA */
        .gear-spin {
            transform: translate(-50%, -50%) rotate(720deg) scale(1.2) !important;
        }

        .door-open-left { transform: translateX(-100%); }
        .door-open-right { transform: translateX(100%); }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Khung Game chính hiển thị sau khi mở cửa -->
    <div id="game-main">
        <h1>MAIN MENU GAME</h1>
        <p>Chào mừng bạn đã vào Game!</p>
    </div>

    <!-- Lớp ánh sáng trắng -->
    <div id="flash-light"></div>

    <!-- Cửa và Bánh Răng -->
    <div class="door-container" id="door-system">
        <div class="door-left" id="door-l"></div>
        <div class="door-right" id="door-r"></div>
        <button class="gear-btn" id="gear-btn" onclick="openDoor()">⚙️</button>
    </div>

    <script>
        function openDoor() {
            const gear = document.getElementById('gear-btn');
            const doorL = document.getElementById('door-l');
            const doorR = document.getElementById('door-r');
            const flash = document.getElementById('flash-light');
            const mainGame = document.getElementById('game-main');
            const doorSystem = document.getElementById('door-system');

            // 1. Nút Bánh răng xoay 2 vòng và phóng to nhẹ
            gear.classList.add('gear-spin');

            setTimeout(() => {
                // 2. Bánh răng mờ dần & Cửa tách ra 2 bên
                gear.classList.add('fade-out');
                doorL.classList.add('door-open-left');
                doorR.classList.add('door-open-right');

                // 3. Bùng sáng trắng
                setTimeout(() => {
                    flash.style.opacity = '1';

                    // 4. Mờ ánh sáng trắng -> Hiện Khung Game chính bên dưới
                    setTimeout(() => {
                        mainGame.style.opacity = '1';
                        flash.style.opacity = '0';
                        doorSystem.style.display = 'none'; // Xóa hẳn cửa khỏi giao diện
                    }, 400);

                }, 400);

            }, 700); // Thời gian chờ bánh răng xoay xong
        }
    </script>
</body>
</html>
