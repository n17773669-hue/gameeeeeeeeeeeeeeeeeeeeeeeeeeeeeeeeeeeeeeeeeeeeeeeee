<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJK Battle 3D - Roblox Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #050508; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; }
        
        .overlay { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(5,5,8,0.9); backdrop-filter: blur(10px); z-index: 100; }
        .hidden { display: none !important; }

        .card { background: #12131a; border: 1px solid #2a2c3d; padding: 30px; border-radius: 16px; width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .card h2 { font-size: 24px; margin-bottom: 20px; color: #00ffcc; letter-spacing: 2px; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; background: #090a0f; border: 1px solid #2a2c3d; border-radius: 8px; color: #fff; outline: none; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #00ffcc, #0099ff); border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }

        /* UI IN-GAME 3D */
        #ui-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: flex; justify-content: space-between; padding: 20px; }
        .stats-box { background: rgba(18, 19, 26, 0.8); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 280px; height: fit-content; pointer-events: auto; }
        .player-name { font-weight: bold; margin-bottom: 8px; color: #00ffcc; display: flex; justify-content: space-between; }
        .bar-container { background: #000; height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 6px; border: 1px solid #333; }
        .hp-fill { background: linear-gradient(90deg, #ff3366, #ff6600); width: 100%; height: 100%; }

        /* KHUNG CHAT TRỰC TUYẾN */
        .chat-container { width: 300px; height: 200px; background: rgba(10, 10, 15, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; flex-direction: column; pointer-events: auto; overflow: hidden; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 5px 8px; border-radius: 4px; word-break: break-word; }
        .chat-input { width: 100%; background: #000; border: none; border-top: 1px solid #222; padding: 8px 10px; color: #fff; outline: none; font-size: 12px; }

        .skills-hud { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; }
        .skill-btn { width: 60px; height: 60px; background: rgba(20, 22, 35, 0.9); border: 2px solid #00ffcc; border-radius: 12px; color: #fff; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,255,204,0.3); }
        .skill-btn span { font-size: 10px; color: #aaa; margin-top: 2px; }

        .controls-hint { position: fixed; bottom: 20px; left: 20px; font-size: 11px; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; pointer-events: auto; }
    </style>

    <!-- Nhúng thư viện Three.js để làm môi trường 3D xịn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="overlay">
        <div class="card">
            <h2>JJK 3D BATTLE</h2>
            <div class="input-group">
                <label>TÊN NHÂN VẬT / OWNER</label>
                <input type="text" id="username-input" placeholder="Nhập tên..." value="Dynamyx">
            </div>
            <button class="btn" onclick="enterGame()">VAO CHIẾN TRƯỜNG 3D</button>
        </div>
    </div>

    <!-- GIAO DIỆN IN-GAME 3D -->
    <div id="ui-layer" class="hidden">
        <div class="stats-box">
            <div class="player-name"><span id="hud-name">Player</span> <span id="hud-badge" style="color: #ffcc00;"></span></div>
            <div class="bar-container"><div id="hp-bar" class="hp-fill"></div></div>
            <p style="font-size: 11px; color: #888; margin-top: 5px;">Trạng thái: <span style="color: #00ffcc;">Sẵn sàng chiến đấu</span></p>
        </div>

        <!-- Khung chat -->
        <div class="chat-container">
            <div id="chat-messages" class="chat-messages">
                <div class="chat-msg"><b>System:</b> Chào mừng đến với đấu trường 3D!</div>
            </div>
            <input type="text" id="chat-input" class="chat-input" placeholder="Nhập tin nhắn..." onkeydown="handleChat(event)">
        </div>
    </div>

    <div id="skills-hud" class="hidden skills-hud">
        <div class="skill-btn" onclick="useSkill('Q')">Q<span>Đấm Năng Lượng</span></div>
        <div class="skill-btn" onclick="useSkill('E')" style="border-color: #9933ff;">E<span>Vô Cực Dash</span></div>
        <div class="skill-btn" onclick="useSkill('R')" style="border-color: #ff0055;">R<span>Bộc Phá Skill</span></div>
    </div>

    <div class="controls-hint hidden" id="hint-box">
        Di chuyển: <b>W, A, S, D</b> | Xoay góc nhìn: <b>Giữ chuột phải + Di chuyển</b> | Kỹ năng: <b>Q, E, R</b>
    </div>

    <script>
        let scene, camera, renderer, player, keys = {}, playerName = "Player", isOwner = false;

        function enterGame() {
            const val = document.getElementById('username-input').value.trim();
            if(!val) return alert("Nhập tên đã!");
            playerName = val;
            if(val.toLowerCase().includes("owner") || val.toLowerCase().includes("dynamyx")) isOwner = true;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('ui-layer').classList.remove('hidden');
            document.getElementById('skills-hud').classList.remove('hidden');
            document.getElementById('hint-box').classList.remove('hidden');

            document.getElementById('hud-name').innerText = playerName;
            if(isOwner) document.getElementById('hud-badge').innerText = "[OWNER HEADLESS]";

            init3D();
        }

        function init3D() {
            // 1. Khởi tạo Scene 3D
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x08080c);
            scene.fog = new THREE.FogExp2(0x08080c, 0.015);

            // 2. Camera góc nhìn thứ 3
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 5. Tạo Mặt Đất Chiến Trường 3D (Có ô bàn cờ / lưới phong cách game đấu trường)
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x11131d, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Thêm các cột trụ / cây cối 3D xung quanh map không đụng hàng
            for(let i = -60; i <= 60; i += 30) {
                for(let j = -60; j <= 60; j += 30) {
                    if(i !== 0 || j !== 0) {
                        const pillarGeo = new THREE.BoxGeometry(4, 25, 4);
                        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x1a1d2e });
                        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                        pillar.position.set(i, 12.5, j);
                        scene.add(pillar);

                        // Đóm sáng phát quang đỉnh cột
                        const glowGeo = new THREE.SphereGeometry(1.5, 8, 8);
                        const glowMat = new THREE.MeshBasicMaterial({ color: isOwner ? 0xff0055 : 0x00ffcc });
                        const glow = new THREE.Mesh(glowGeo, glowMat);
                        glow.position.set(i, 25, j);
                        scene.add(glow);
                    }
                }
            }

            // 6. Tạo Nhân Vật 3D (Player)
            const playerGroup = new THREE.Group();
            
            // Thân nhân vật
            const bodyGeo = new THREE.BoxGeometry(2, 4, 1);
            const bodyMat = new THREE.MeshStandardMaterial({ color: isOwner ? 0xff0055 : 0x00ffcc });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 2;
            playerGroup.add(body);

            // Đầu nhân vật (Nếu là Owner sẽ tàng hình tạo hiệu ứng Headless)
            if(!isOwner) {
                const headGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 4.7;
                playerGroup.add(head);
            }

            scene.add(playerGroup);
            player = playerGroup;

            // Xử lý phím bấm di chuyển
            window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        // Vòng lặp game 3D (Game Loop)
        let moveSpeed = 0.4;
        function animate() {
            requestAnimationFrame(animate);

            // Điều khiển W, A, S, D di chuyển trong không gian 3D
            if (keys['w'] || keys['arrowup']) player.position.z -= moveSpeed;
            if (keys['s'] || keys['arrowdown']) player.position.z += moveSpeed;
            if (keys['a'] || keys['arrowleft']) player.position.x -= moveSpeed;
            if (keys['d'] || keys['arrowright']) player.position.x += moveSpeed;

            // Camera tự động bắt góc nhìn phía sau lưng nhân vật (Góc nhìn TSB / Roblox chuẩn)
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 8;
            camera.position.z = player.position.z + 14;
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

            renderer.render(scene, camera);
        }

        // Xử lý tung chiêu 3D
        function useSkill(skillName) {
            addChat("Hệ thống", `Bạn vừa tung chiêu kỹ năng: [${skillName}] hoành tráng!`);
            // Tạo hiệu ứng chớp sáng khi bấm skill
            scene.background = new THREE.Color(0x1a0033);
            setTimeout(() => scene.background = new THREE.Color(0x08080c), 150);
        }

        // Xử lý khung chat
        function handleChat(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (text) {
                    addChat(playerName, text);
                    input.value = '';
                }
            }
        }

        function addChat(sender, msg) {
            const chatBox = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<b>${sender}:</b> ${msg}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
