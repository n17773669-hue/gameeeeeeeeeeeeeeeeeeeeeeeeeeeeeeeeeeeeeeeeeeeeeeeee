<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chiến Trường Vĩnh Cửu</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#f0b955;--r:#d3301a;--ink:#f3e6c8;--dim:#a88a5c;--a:#ff9a2a;--f:"Noto Serif",Georgia,serif}
html,body{height:100%;overflow:hidden;background:#050102;color:var(--ink);font-family:var(--f)}
button{font-family:inherit;color:inherit;cursor:pointer}
/* nền dùng chung */
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 28% 78%,#8c1a0a,#2a0709 48%,#060102 85%)}
#bg::before{content:"";position:absolute;left:60%;top:12%;width:min(34vmin,320px);aspect-ratio:1;border-radius:50%;transform:translate(calc(var(--px,0)*.5px),0);background:radial-gradient(circle at 40% 38%,#ffd9a0,#ff5a2a 55%,#8a1208);opacity:.32;filter:blur(1px);box-shadow:0 0 90px 30px rgba(255,70,30,.3)}
#bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,180,100,.035) 46px 48px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:3}
/* nhân vật: 1 lớp duy nhất, dùng cho cả đăng nhập + sảnh */
#char{position:fixed;left:3%;bottom:0;height:calc(100vh - 120px);width:min(46vw,640px);z-index:2;pointer-events:none;opacity:0;
 transform:translateX(calc(var(--px,0)*-1px));transition:opacity .8s,left .8s cubic-bezier(.2,.7,.2,1),filter .8s}
body[data-v=lobby] #char,body[data-v=auth] #char{opacity:1}
body[data-v=auth] #char{left:-4%;filter:brightness(.55) saturate(.8)}
#char .mand{position:absolute;left:50%;top:14%;width:92%;aspect-ratio:1;margin-left:-46%;opacity:.12;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#fig{position:absolute;inset:0;animation:br 5s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 0 28px color-mix(in srgb,var(--a) 45%,transparent))}
@keyframes br{50%{transform:scale(1.015) translateY(-6px)}}
#fig svg,#fig img{width:100%;height:100%;object-fit:contain;object-position:bottom}
#char::before{content:"";position:absolute;left:0;right:0;top:6%;bottom:0;z-index:-1;background:radial-gradient(ellipse at 50% 58%,rgba(255,190,130,.24),transparent 66%)}
#bg.art{background-size:cover;background-position:center}#bg.art::before,#bg.art::after{display:none}
/* router */
#app{position:fixed;inset:0;z-index:5}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.015);transition:opacity .45s,transform .45s;overflow:hidden}
.view.on{opacity:1;pointer-events:auto;transform:none}
/* intro (ngắn) */
#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050102;cursor:pointer;transition:opacity .7s}
#gate h1{font:800 clamp(26px,6vw,76px)/1.1 var(--f);letter-spacing:.14em;text-align:center;color:#fff3d8;position:relative;animation:in 1.4s both}
#gate h1 em{display:block;font:500 .3em var(--f);letter-spacing:.7em;color:var(--g);margin-top:.9em}
#gate p{margin-top:5vh;font-size:13px;letter-spacing:.4em;color:var(--dim);animation:bl 1.6s infinite}
#gate::after{content:"";position:absolute;left:-10%;right:-10%;top:50%;height:3px;background:linear-gradient(90deg,transparent,#fff,var(--r),transparent);transform:rotate(-14deg) scaleX(0);opacity:0}
#gate.go::after{animation:slash .7s ease-out forwards}
#gate.go h1{animation:gl .5s steps(2) both}
@keyframes in{from{opacity:0;letter-spacing:.5em}}@keyframes bl{50%{opacity:.25}}
@keyframes slash{30%{transform:rotate(-14deg) scaleX(1);opacity:1}to{transform:rotate(-14deg) scaleX(1.1);opacity:0}}
@keyframes gl{50%{transform:translateX(8px) skewX(-8deg)}}
/* intro điện ảnh kiểu anime */
.cb{position:absolute;left:0;right:0;height:12vh;background:#000;z-index:3;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.cb.t{top:0;transform:translateY(-100%)}.cb.b{bottom:0;transform:translateY(100%)}.go .cb{transform:none}
#ray{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;opacity:0;transition:opacity 1.2s;
 background:repeating-conic-gradient(rgba(255,200,140,0) 0 4deg,rgba(255,200,140,.13) 5deg 6deg);-webkit-mask:radial-gradient(circle,transparent 8%,#000 60%);mask:radial-gradient(circle,transparent 8%,#000 60%);animation:spin 80s linear infinite}
#gate.p2{background:transparent}.p2 #ray{opacity:1}.p2 h1,.p2>p{opacity:0;transition:opacity .4s}
#sub{position:absolute;left:0;right:0;bottom:20vh;text-align:center;font:500 clamp(15px,2.2vw,24px)/1.6 var(--f);letter-spacing:.08em;text-shadow:0 2px 10px #000;opacity:0;z-index:2}
#sub.on{animation:subin 1.7s both}@keyframes subin{0%{opacity:0;transform:translateY(10px)}18%,78%{opacity:1;transform:none}100%{opacity:0}}
#tt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:800 clamp(30px,8vw,110px)/1.05 var(--f);letter-spacing:.1em;color:#fff3d8;opacity:0;z-index:2;pointer-events:none}
#tt.on{animation:slam .7s cubic-bezier(.2,.9,.2,1) both;text-shadow:5px 0 0 rgba(255,40,30,.8),-5px 0 0 rgba(60,200,255,.6),0 0 40px rgba(255,90,30,.6)}
@keyframes slam{from{opacity:0;transform:scale(2.2) skewX(-10deg)}to{opacity:1;transform:none}}
#ld{position:absolute;left:50%;bottom:17vh;width:min(46vw,420px);height:4px;margin-left:calc(min(46vw,420px)/-2);background:rgba(255,255,255,.15);opacity:0;transition:opacity .5s;z-index:2}
#ld::before{content:"Đang triệu tập binh mã...";position:absolute;top:-22px;left:0;font-size:12px;letter-spacing:.2em;color:var(--g)}
#ld i{display:block;height:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#8a1208,#ff3b1f,#ffd36a);transition:transform 2.2s linear}
#ld.run{opacity:1}#ld.run i{transform:scaleX(1)}
#skip{display:none;position:absolute;right:3%;top:14vh;z-index:5;padding:8px 16px;background:rgba(0,0,0,.5);border:1px solid rgba(240,185,85,.4);font-size:12px;letter-spacing:.2em;color:var(--dim)}.go #skip{display:block}
#gate.fl::before{content:"";position:absolute;inset:0;background:#fff;z-index:9;animation:fl .5s both}@keyframes fl{from{opacity:0}to{opacity:1}}
body[data-v=intro] #char{left:30%}
body[data-v=intro].sil #char{opacity:1;filter:brightness(0)}
body[data-v=intro].rev #char{opacity:1;filter:none}
/* nút kiểu chéo */
.btn{position:relative;display:block;width:100%;padding:14px;border:1px solid rgba(240,185,85,.55);background:rgba(10,3,4,.55);font:800 14px var(--f);letter-spacing:.18em;transform:skewX(-10deg);transition:.2s}
.btn>span{display:block;transform:skewX(10deg)}
.btn:hover{background:rgba(240,185,85,.16);box-shadow:0 0 18px rgba(255,150,40,.35)}
.btn.pri{background:linear-gradient(180deg,#d9381f,#8a1208);border-color:#ffd98a}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:none;border-color:rgba(240,185,85,.3);font-size:12px;color:var(--dim)}
/* đăng nhập */
.auth{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 8vw}
.card{width:min(400px,100%);padding:30px 28px;background:linear-gradient(160deg,rgba(60,8,6,.78),rgba(12,2,3,.88));backdrop-filter:blur(6px);border-left:3px solid var(--g);box-shadow:0 0 50px rgba(0,0,0,.6)}
.card h2{font:800 22px/1.25 var(--f);letter-spacing:.1em;margin-bottom:4px}
.card .sub{font-size:12px;color:var(--dim);margin-bottom:20px}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;padding:10px;border:0;background:rgba(0,0,0,.35);font:800 13px var(--f);letter-spacing:.14em;color:var(--dim)}
.tab.on{background:var(--g);color:#1a0503}
.fld{display:block;margin-bottom:14px}.fld span{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.fld input{width:100%;padding:11px 12px;background:rgba(0,0,0,.5);border:1px solid rgba(240,185,85,.3);color:#fff3d6;font:500 15px var(--f);outline:0}
.fld input:focus{border-color:var(--g);box-shadow:0 0 14px rgba(255,150,40,.3)}
.fld.bad input{border-color:#ff6a5a}
.reg-only{display:none}.reg .reg-only{display:block}.reg .log-only{display:none}
.seals{display:none;gap:6px;margin-bottom:14px}.reg .seals{display:flex}
.seals label{flex:1}.seals input{display:none}
.seals b{display:block;text-align:center;padding:9px 2px;font-size:11px;border:1px solid rgba(240,185,85,.3);background:rgba(0,0,0,.4);cursor:pointer}
.seals input:checked+b{background:var(--r);border-color:#ffd98a}
#msg{min-height:20px;font-size:13px;color:#ff8a7a;margin-bottom:8px}#msg.ok{color:var(--g)}
.card .btn+.btn{margin-top:10px}
.sh{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}60%{transform:translateX(7px)}}
/* sảnh chờ (Limbus) */
.hud{position:absolute;display:flex;align-items:center;gap:12px;z-index:6}
.hud.tl{left:2.5%;top:2.5%}.hud.tr{right:2.5%;top:2.5%;gap:10px}
.av{position:relative;overflow:hidden;padding:0;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:800 24px var(--f);background:radial-gradient(#a01808,#2a0505);border:2px solid var(--g);transition:.2s}.av img{width:100%;height:100%;object-fit:cover}.av:hover{box-shadow:0 0 16px var(--g)}.av:hover::after{content:"Đổi";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.65);font-size:12px}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}.avg button{aspect-ratio:1;font-size:24px;border-radius:50%;border:1.5px solid rgba(240,185,85,.4);background:rgba(0,0,0,.4)}.avg button.on{border-color:var(--g);background:rgba(240,185,85,.22)}
.who b{display:block;font-size:16px}.who small{font-size:11px;color:var(--dim)}
.res{display:flex;gap:6px;margin-left:8px}.res span{font-size:12px;padding:5px 10px;background:rgba(0,0,0,.45);border-bottom:2px solid rgba(240,185,85,.5)}
.ic{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--g);background:rgba(10,3,4,.7);font-size:17px;transition:.2s}
.ic:hover{background:rgba(240,185,85,.2);transform:translateY(-2px)}.ic.off{opacity:.4}
.side{position:absolute;right:3%;top:16%;width:min(300px,34vw);display:flex;flex-direction:column;gap:12px;z-index:6}
.ban{padding:16px;min-height:96px;background:linear-gradient(120deg,rgba(150,20,10,.7),rgba(20,3,4,.8));border-left:3px solid var(--g);cursor:pointer;transition:.2s}
.ban:hover{transform:translateX(-4px)}.ban b{display:block;font-size:15px;margin-bottom:4px}.ban small{font-size:12px;color:var(--dim)}
.stats{padding:10px 14px;background:rgba(0,0,0,.4);font-size:12px}
.stats div{display:flex;align-items:center;gap:8px;margin:6px 0}.stats span{width:70px;color:var(--dim)}
.stats i{flex:1;height:3px;background:rgba(255,255,255,.12)}.stats u{display:block;height:100%;background:linear-gradient(90deg,#8a1208,var(--a))}
.say{position:absolute;left:3%;bottom:15%;max-width:min(520px,60vw);z-index:6;padding:10px 18px;background:rgba(0,0,0,.55);border-left:3px solid var(--a);font-size:15px;line-height:1.6;text-shadow:0 2px 6px #000;pointer-events:none;transition:opacity .25s}
.say b{display:block;font-size:12px;color:var(--a);letter-spacing:.15em}
#hit{position:absolute;left:12%;bottom:0;width:30vw;height:80vh;z-index:5;cursor:pointer}
.nav{position:absolute;right:3%;bottom:4%;display:flex;gap:8px;z-index:6;width:min(640px,94vw)}
.nav .btn{padding:18px 6px;font-size:13px}.nav .btn small{display:block;font-weight:500;font-size:10px;letter-spacing:.1em;color:var(--dim);margin-top:3px}
/* màn chế độ */
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:16px;padding:14px 3%;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);z-index:2}
.bar b{font-size:18px;letter-spacing:.14em}.bar .back{padding:8px 16px;border:1px solid var(--g);background:rgba(10,3,4,.7);font-size:13px}
.slot{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)}
/* cài đặt + toast */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(0,0,0,.7)}.modal.on{display:grid}
.row{display:block;font-size:12px;color:var(--dim);margin-bottom:14px}.row input{display:block;width:100%;margin-top:6px;accent-color:var(--g)}
#toast{position:fixed;left:50%;top:12%;transform:translate(-50%,-10px);opacity:0;z-index:60;padding:10px 20px;background:#1a0503;border:1px solid var(--g);font-size:13px;transition:.3s;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
#cover{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:80;transition:opacity .35s}#cover.on{opacity:1}
@media(max-width:760px){
 #char{height:62vh;width:90vw;left:-12%}body[data-v=auth] #char{left:-30%}.auth{justify-content:center;padding:0 5vw}
 .side{display:none}.say{bottom:21%;max-width:90vw;left:5%}.nav{flex-wrap:wrap;right:3%}.nav .btn{flex:1 1 40%}.res{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body data-v="">
<div id="bg"></div><canvas id="fx"></canvas>
<div id="char"><div class="mand" id="mand"></div><div id="fig"></div></div>
<main id="app"></main>
<div class="modal" id="setBox"><div class="card"><h2>Cài đặt</h2><div class="sub">Lưu tự động trên máy này</div>
 <label class="row">Âm lượng tổng<input type="range" id="sV" min="0" max="100"></label>
 <label class="row">Nhạc nền<input type="range" id="sM" min="0" max="100"></label>
 <label class="row"><input type="checkbox" id="sF" style="display:inline;width:auto;margin-right:8px">Hiệu ứng tàn lửa</label>
 <button class="btn" id="sFull" type="button"><span>Toàn màn hình</span></button>
 <button class="btn pri" id="sClose" type="button"><span>Xong</span></button></div></div>
<div class="modal" id="avBox"><div class="card"><h2>Ảnh đại diện</h2><div class="sub">Chọn biểu tượng hoặc tải ảnh của bạn</div><div class="avg" id="avGrid"></div><input type="file" id="avFile" accept="image/*" hidden>
 <button class="btn" id="avUp" type="button"><span>Tải ảnh lên</span></button><button class="btn ghost" id="avDel" type="button"><span>Dùng chữ cái mặc định</span></button><button class="btn pri" id="avClose" type="button"><span>Xong</span></button></div></div>
<div id="toast"></div><div id="cover"></div>
<div id="gate"><div class="cb t"></div><div class="cb b"></div><div id="ray"></div><h1>CHIẾN TRƯỜNG<br>VĨNH CỬU<em>HÀO KHÍ NGÀN NĂM</em></h1><p>CHẠM ĐỂ BẮT ĐẦU</p><div id="sub"></div><div id="tt">CHIẾN TRƯỜNG<br>VĨNH CỬU</div><div id="ld"><i></i></div><button id="skip" type="button">BỎ QUA ›</button></div>

<script>
/* ============ CẤU HÌNH ============ */
const CFG={
  CHAR_IMG:"char.png",      // ảnh nhân vật
  BG_IMG:"bg.jpg",          // tranh nền sảnh (1920x1080, chừa trống bên trái cho nhân vật). Không có file thì dùng nền mặc định
       // PNG nền trong suốt, cao, nhân vật cắt ngang eo/đùi là đẹp nhất
  GAME_MODULE:"",           // vd "./campaign.js" -> export async function start(container, Shell){ return {pause(){},resume(){}} }
  API_URL:""                // trống = lưu tài khoản trong trình duyệt (thử nghiệm)
};
const $=id=>document.getElementById(id),Q=s=>document.querySelector(s);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const Shell={user:null,SFX:null,go:(n)=>App.go(n),toast:t=>toast(t),exit:()=>App.go('lobby')};
window.Shell=Shell;

/* ============ ROUTER: đổi màn/chế độ KHÔNG tải lại trang ============
   Thêm chế độ mới:  App.reg('ten',{mount(el,Shell){...}, show(el){...}, hide(el){...}})
   Chuyển màn:        Shell.go('ten')   (nút HTML: data-go="ten")                          */
const App={cur:null,V:{},
  reg(n,v){this.V[n]=v},
  async go(n,push=true){
    if(n!=='auth'&&!Shell.user)n='auth';
    if(n===this.cur||!this.V[n])return;
    const v=this.V[n];let el=$('v-'+n);
    if(!el){el=document.createElement('section');el.id='v-'+n;el.className='view';$('app').appendChild(el);await v.mount(el,Shell)}
    if(this.cur){$('v-'+this.cur)?.classList.remove('on');this.V[this.cur]?.hide?.($('v-'+this.cur))}
    el.classList.add('on');v.show?.(el);this.cur=n;document.body.dataset.v=n;
    if(push)history.pushState({n},'','#'+n)},
  reset(){document.querySelectorAll('.view').forEach(e=>e.remove());this.cur=null}};
addEventListener('popstate',e=>App.go((e.state&&e.state.n)||'lobby',false));
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){SFX.click();App.go(b.dataset.go)}});

/* ============ ÂM THANH (nhỏ gọn, nhạc ngũ cung tự sinh) ============ */
let ac,master,mus;const KS={};const SET=LS.get('sb_set')||{};
const MV=()=>SET.m!=null?SET.m:.6;
function tn(f,f2,d,v,type='sine',t0=0,out=master){const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05)}
function pluck(f,t0,v){const k=Math.round(f);let b=KS[k];
  if(!b){const sr=ac.sampleRate,n=sr*1.6|0,p=Math.round(sr/f),d=new Float32Array(n);b=ac.createBuffer(1,n,sr);
    for(let i=0;i<=p;i++)d[i]=Math.random()*2-1;for(let i=p+1;i<n;i++)d[i]=.4985*(d[i-p]+d[i-p-1]);b.copyToChannel(d,0);KS[k]=b}
  const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(mus);s.start(ac.currentTime+t0)}
function drum(t0){tn(210,165,.9,.3,'sine',t0,mus);tn(480,390,.4,.12,'sine',t0,mus)}
function initAudio(){
  ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();
  master=ac.createGain();master.gain.value=SET.v!=null?SET.v:.85;master.connect(ac.destination);
  mus=ac.createGain();mus.gain.value=MV();const dl=ac.createDelay(),fb=ac.createGain();dl.delayTime.value=.34;fb.gain.value=.38;
  mus.connect(master);mus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);
  const S=[0,2,5,7,9];let deg=5,bar=0,next=ac.currentTime+.3;const fq=n=>146.83*Math.pow(2,(Math.floor(n/5)*12+S[((n%5)+5)%5])/12);
  setInterval(()=>{if(document.hidden)return;while(next<ac.currentTime+1.5){const o=next-ac.currentTime;
    for(let i=0;i<8;i++)if(Math.random()<(i%2?.35:.65)){deg=Math.max(0,Math.min(12,deg+[-2,-1,-1,1,1,2][Math.random()*6|0]));pluck(fq(deg),o+i*.4,.12)}
    if(bar%2===0)drum(o);bar++;next+=3.2}},400)}
const SFX=Shell.SFX={
  click(){if(ac)tn(260,110,.1,.3,'triangle')},
  ok(){if(ac)[293.66,369.99,440,587.33].forEach((f,i)=>pluck(f,i*.1,.3))},
  err(){if(ac){tn(130,45,.4,.6);tn(185,60,.3,.25,'sawtooth',.08)}},
  go(){if(ac){drum(0);drum(.15);tn(110,55,1.2,.4,'sawtooth')}}};

/* ============ TÀN LỬA ============ */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],embers=SET.fx!==0;const MAXP=innerWidth<800?25:55;
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
(function loop(t){cx.clearRect(0,0,cv.width,cv.height);
  if(embers&&P.length<MAXP&&Math.random()<.3)P.push({x:Math.random()*cv.width,y:cv.height+6,vy:-(.8+Math.random()*1.8),r:1+Math.random()*2,l:1,ph:Math.random()*9});
  for(const p of P){p.y+=p.vy;p.x+=Math.sin(t/500+p.ph)*.5;p.l-=.004;cx.globalAlpha=Math.max(p.l,0)*.8;cx.fillStyle='#ffb040';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
  P=P.filter(p=>p.l>0&&p.y>-10);requestAnimationFrame(loop)})(0);

/* ============ MÀN ĐĂNG NHẬP ============ */
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const strHash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(16)};
async function hashPw(pw,salt){
  if(!(window.crypto&&crypto.subtle))return 'x'+strHash(salt+pw);       // mở bằng file:// vẫn chạy (chỉ để thử nghiệm)
  const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256);
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function api(path,body){const r=await fetch(CFG.API_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'Lỗi máy chủ');return d.user}
async function register(u,name,pw,seal){
  if(CFG.API_URL)return api('/register',{username:u,name,password:pw,seal});
  const us=LS.get('sb_users')||{},k=u.toLowerCase();if(us[k])throw new Error('Tên đăng nhập đã có người dùng');
  const salt=Math.random().toString(36).slice(2);us[k]={user:u,name,seal,salt,hash:await hashPw(pw,salt)};LS.set('sb_users',us);return{name,user:u,seal,provider:'local'}}
async function login(u,pw){
  if(CFG.API_URL)return api('/login',{username:u,password:pw});
  const x=(LS.get('sb_users')||{})[u.toLowerCase()];if(!x||x.hash!==await hashPw(pw,x.salt))throw new Error('Sai tên đăng nhập hoặc mật khẩu');
  return{name:x.name,user:x.user,seal:x.seal||'R',avatar:x.avatar||null,provider:'local'}}
function signIn(user,remember){Shell.user=user;remember?LS.set('sb_session',user):LS.del('sb_session');setFig(user);SFX.ok();App.go('lobby')}
function signOut(){Shell.user=null;LS.del('sb_session');App.reset();setFig();App.go('auth')}

   <label class="fld log-only" style="font-size:13px;color:var(--dim)"><input id="rem" type="checkbox" checked style="width:auto;margin-right:8px">Ghi nhớ trên máy này</label>

    try{const user=mode==='reg'?await register(u,nick,pw,Q('input[name=seal]:checked').value):await login(u,pw);signIn(user,mode==='reg'||$('rem').checked)}
    catch(err){fail(err.message||'Có lỗi xảy ra',['user'])}

/* ============ ĐỔI AVATAR (biểu tượng có sẵn hoặc tải ảnh lên) ============ */
const AVS=['🐉','🕊','🐯','🐢','⚔','🏯'];
function renderAv(){const a=$('av'),u=Shell.user;if(!a||!u)return;a.innerHTML='';
  if(u.avatar&&u.avatar.startsWith('data:')){const i=new Image();i.alt='';i.src=u.avatar;a.appendChild(i)}else a.textContent=u.avatar||u.seal||'K'}
function markAv(){document.querySelectorAll('#avGrid button').forEach(b=>b.classList.toggle('on',b.textContent===(Shell.user&&Shell.user.avatar)))}
function saveAv(v){const u=Shell.user;u.avatar=v;
  if(LS.get('sb_session'))LS.set('sb_session',u);
  if(!CFG.API_URL&&u.provider==='local'){const us=LS.get('sb_users')||{},k=(u.user||'').toLowerCase();if(us[k]){us[k].avatar=v;LS.set('sb_users',us)}}
  // có máy chủ: gọi thêm fetch(CFG.API_URL+'/avatar',...) ở đây để lưu lên server
  renderAv();markAv()}
(function(){const g=$('avGrid');AVS.forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.onclick=()=>{SFX.click();saveAv(e)};g.appendChild(b)});
  document.addEventListener('click',e=>{if(e.target.closest('#av')){SFX.click();markAv();$('avBox').classList.add('on')}});
  $('avClose').onclick=()=>$('avBox').classList.remove('on');
  $('avBox').addEventListener('click',e=>{if(e.target.id==='avBox')$('avBox').classList.remove('on')});
  $('avUp').onclick=()=>$('avFile').click();$('avDel').onclick=()=>saveAv(null);
  $('avFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>8e6)return toast('Ảnh quá lớn (tối đa 8MB)');
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);saveAv(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(f)}})();
</script>
